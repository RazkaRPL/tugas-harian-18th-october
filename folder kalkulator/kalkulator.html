  <section class="sectionkalkulator">
    <div class="kotak-kalkulator">
      <h1 class="kalkulatorh1">Kalkulator</h1>
      <p class="pkalkulator">Digunakan untuk menghitung nilai rata rata. Nilai Tugas, UTS, UAS
      </p>
      <div class="nilaitugas">
        <h2>
          Nilai Tugas
        </h2>
        <input type="number" min="0" max="100" placeholder="Input nilai" step="1" class="input1">
      </div>

      <div class="nilaiuts">
        <h2>
          Nilai UTS
        </h2>
        <input type="number" min="0" max="100" placeholder="Input nilai" step="1" class="input2">
      </div>

      <div class="nilaiuas">
        <h2>
          Nilai UAS
        </h2>
        <input type="number" min="0" max="100" placeholder="Input nilai" step="1" class="input3">
      </div>

      <button class="button-hasil"><h3 class="h3-button">Hasil</h3></button>

      <h2 id="output"></h2>
    </div>
  </section>
